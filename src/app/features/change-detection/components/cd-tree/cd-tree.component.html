<svg
  class="tree-svg"
  viewBox="0 0 520 180"
  xmlns="http://www.w3.org/2000/svg"
  aria-hidden="true"
>

  <!-- ── Connection lines ──────────────────────────────────────────────────── -->

  <!-- AppRoot → CDLab vertical -->
  <line x1="260" y1="34" x2="260" y2="66" class="tree-line"
    [class.tree-line--active]="rootAnim() === 'active' || labAnim() === 'active'" />

  <!-- CDLab → horizontal bar -->
  <line x1="260" y1="98" x2="260" y2="118" class="tree-line"
    [class.tree-line--active]="labAnim() === 'active'" />

  <!-- Horizontal bar -->
  <line x1="85" y1="118" x2="435" y2="118" class="tree-line"
    [class.tree-line--active]="labAnim() === 'active'" />

  <!-- Drops to each child -->
  <line x1="85"  y1="118" x2="85"  y2="132" class="tree-line"
    [class.tree-line--active]="labAnim() === 'active'" />
  <line x1="260" y1="118" x2="260" y2="132" class="tree-line"
    [class.tree-line--active]="labAnim() === 'active'" />
  <line x1="435" y1="118" x2="435" y2="132" class="tree-line"
    [class.tree-line--active]="labAnim() === 'active'" />


  <!-- ── AppRoot node ──────────────────────────────────────────────────────── -->
  <g class="tree-node node-framework" [class.node--active]="rootAnim() === 'active'">
    <rect x="200" y="4" width="120" height="30" rx="6" class="node-rect" />
    <text x="260" y="19" class="node-name" dominant-baseline="central" text-anchor="middle">AppRoot</text>
  </g>


  <!-- ── CDLab node ────────────────────────────────────────────────────────── -->
  <g class="tree-node node-framework" [class.node--active]="labAnim() === 'active'">
    <rect x="200" y="66" width="120" height="30" rx="6" class="node-rect" />
    <text x="260" y="81" class="node-name" dominant-baseline="central" text-anchor="middle">CDLab</text>
  </g>


  <!-- ── Default child ─────────────────────────────────────────────────────── -->
  <g class="tree-node node-default"
    [class.node--checked] ="defaultAnim() === 'checked'"
    [class.node--skipped] ="defaultAnim() === 'skipped'"
    [class.node--targeted]="defaultAnim() === 'targeted'"
  >
    <rect x="30" y="132" width="110" height="36" rx="6" class="node-rect" />
    <text x="85" y="146" class="node-name"     dominant-baseline="central" text-anchor="middle">DefaultCd</text>
    <text x="85" y="160" class="node-strategy" dominant-baseline="central" text-anchor="middle">.Default</text>
  </g>


  <!-- ── OnPush child ──────────────────────────────────────────────────────── -->
  <g class="tree-node node-onpush"
    [class.node--checked] ="onpushAnim() === 'checked'"
    [class.node--skipped] ="onpushAnim() === 'skipped'"
    [class.node--targeted]="onpushAnim() === 'targeted'"
  >
    <rect x="205" y="132" width="110" height="36" rx="6" class="node-rect" />
    <text x="260" y="146" class="node-name"     dominant-baseline="central" text-anchor="middle">OnPushCd</text>
    <text x="260" y="160" class="node-strategy" dominant-baseline="central" text-anchor="middle">.OnPush</text>
  </g>


  <!-- ── Signal child ──────────────────────────────────────────────────────── -->
  <g class="tree-node node-signal"
    [class.node--checked] ="signalAnim() === 'checked'"
    [class.node--skipped] ="signalAnim() === 'skipped'"
    [class.node--targeted]="signalAnim() === 'targeted'"
  >
    <rect x="380" y="132" width="110" height="36" rx="6" class="node-rect" />
    <text x="435" y="146" class="node-name"     dominant-baseline="central" text-anchor="middle">SignalCd</text>
    <text x="435" y="160" class="node-strategy" dominant-baseline="central" text-anchor="middle">signal</text>
  </g>

</svg>
